          <p style="font-size: 16px; color: #9ca3af; line-height: 1.5; margin-bottom: 12px;">In 1976, American fascist Michael Townley planted a car bomb that killed Orlando Letelier, a socialist economist, in downtown Washington, D.C. This trilogy explores their lives.</p>

            <div itemprop="description">
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Across three decades of political and social upheaval in Chile, four lives are entangled through marriage, ideology, and the pursuit of power. At the center of Corilocho is Orlando Letelier: driven by ambition and patriotism, he builds a career in politics while his marriage to Isabel unfolds alongside his growing responsibilities, as his principles draw him into an increasingly turbulent national landscape and the choices he makes lead to dire consequences for the people closest to him.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Meanwhile, Michael Townley and Mariana Callejas are pursuing ambitions of their own. Their marriage draws them toward the Chilean right, where militant commitment and personal advancement become increasingly difficult to separate. As provocateurs, then saboteurs, and later assassins, their actions set in motion events that will intersect with and shape Orlando and Isabel’s lives in fundamental ways.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 8px;">A story of love, idealism, and betrayal, Corilocho traces the personal costs of choices made in the name of political conviction.</p>

            <div itemprop="description">
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">As Chile descends into fascism, the loyalties of four individuals draw them into an increasingly dangerous world.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Drawn by promises of wealth and influence, Mariana becomes increasingly involved with right-wing paramilitary men, while Michael discovers that his talents as a bomb-maker are evolving into an expectation that he will plant the bombs himself.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Meanwhile, Orlando Letelier is sent to a prison camp on an island near the Antarctic Circle, where he and his fellow political prisoners face harsh conditions and an uncertain future, while Isabel mounts an international campaign to save him, even as the military targets her and her children.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 8px;">Where personal loyalties collide with political ambition, the consequences of individual choices extend far beyond the people who make them.</p>

            <div itemprop="description">
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">As the conflict in Chile extends beyond its borders, the lives of Orlando and Isabel Letelier, Michael Townley, and Mariana Callejas converge in a series of events with international repercussions.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">The Leteliers are resuming their lives in Washington after Orlando’s imprisonment and exile, where they’re emerging as leaders of the resistance to Chile’s military government. Determined to expose the regime’s abuses and challenge its influence abroad, Orlando draws on his international political relationships, while Isabel founds a human rights institution with deep fundraising and artistic connections, but Orlando and Isabel’s marriage, tested by separation and loneliness, faces new strains after Orlando confesses an affair -- though not the fact that it’s still going on.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Meanwhile, Michael Townley and Mariana Callejas have become Chilean intelligence operatives whose assignments take them from Miami to Mexico City and across Europe, where they cultivate alliances with far-right organizations to organize assassination plots targeting opponents of the Chilean regime. As Mariana manages these relationships and Michael expands into producing biological and chemical weapons, their private ambitions become inseparable from the regime's violence.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Orlando's campaign is gaining momentum, but Michael Townley is closing in.</p>
              <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 8px;">The political conflict that destroyed their lives resonates into our time.</p>
