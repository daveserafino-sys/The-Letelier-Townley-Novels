        <header style="margin-bottom: 28px; border-bottom: 1px solid #27272a; padding-bottom: 20px;">
          <h1 style="font-size: 26px; font-weight: 700; color: #f3f4f6; margin-bottom: 8px;">The Letelier / Townley Novels &amp; Selected Publications</h1>
          <p style="font-size: 16px; color: #9ca3af; line-height: 1.5; margin-bottom: 12px;">In 1976, American fascist Michael Townley planted a car bomb that killed Orlando Letelier, a socialist economist, in downtown Washington, D.C. This trilogy explores their lives.</p>
          <p style="font-size: 13px; color: #6b7280; line-height: 1.4;">Focus: Chile &bull; Historical Fiction &bull; Augusto Pinochet &bull; Operation Condor &bull; Assassination &bull; Literary Fiction &bull; Orlando Letelier &bull; Michael Townley &bull; DINA &bull; Cold War Espionage.</p>
        </header>
        <section style="margin-bottom: 24px;">
          <h2 style="font-size: 20px; font-weight: 600; color: #e5e7eb; margin-bottom: 12px;">The Letelier / Townley Novels</h2>
          <article style="margin-bottom: 20px;">
            <h3 style="font-size: 16px; font-weight: 600; color: #d4d4d8;">1. Corilocho (Book One)</h3>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Across three decades of political and social upheaval in Chile, four lives are entangled through marriage, ambition, ideology, and the pursuit of power. At the center of Corilocho is Orlando Letelier: driven by ambition and patriotism, he builds a career in politics and diplomacy while trying to preserve the personal relationships that give his life meaning. His marriage to Isabel unfolds alongside his growing responsibilities, as his political convictions draw him into an increasingly turbulent national landscape and the choices he makes lead to consequences for the people closest to him.</p>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Meanwhile, Michael Townley and Mariana Callejas are pursuing ambitions of their own. Their marriage draws them into the ideological circles of the Chilean right, where political commitment and personal advancement become increasingly difficult to separate. As saboteurs, and later assassins, their actions set in motion events that will intersect with and shape Orlando and Isabel's lives in the most consequential ways.</p>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6;">A story of love, idealism, and betrayal, Corilocho traces the personal costs of choices made in the name of political conviction.</p>
          </article>
          <article style="margin-bottom: 20px;">
            <h3 style="font-size: 16px; font-weight: 600; color: #d4d4d8;">2. Saltwater Archives (Book Two)</h3>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">As Chile descends into fascism, the ambitions and loyalties of four individuals draw them into an increasingly dangerous world.</p>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Michael Townley and Mariana Callejas find themselves at the center of a network operating behind the scenes of Chilean politics. Drawn by promises of wealth and influence, Mariana becomes increasingly involved with right-wing paramilitary men, while Michael discovers that his technical abilities offer opportunities far beyond ordinary employment.</p>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Meanwhile, Orlando Letelier is sent to Dawson Island, near the Antarctic Circle, where he and his fellow political detainees face harsh conditions and an uncertain future, and Isabel mounts an international campaign to save him even as the military regime targets her personally.</p>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6;">As personal loyalties collide with political ambition, the consequences of personal choices extend far beyond the people who make them.</p>
          </article>
          <article style="margin-bottom: 20px;">
            <h3 style="font-size: 16px; font-weight: 600; color: #d4d4d8;">3. We Are Sympathetic (Book Three)</h3>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">The Leteliers resume their lives in Washington after Orlando’s imprisonment and exile, where they emerge as leaders of the resistance to Chile’s military government. Determined to expose the regime's abuses and challenge its influence abroad, Orlando draws on his political experience and international connections, while Isabel founds a human rights institution and stages rallies that include a benefit concert at Madison Square Garden headlined by Joan Baez and Pete Seeger, where Orlando was the keynote speaker. But the demands of their public campaigns are matched by growing complications. His marriage to Isabel, tested by years of separation and political upheaval, faces new strains after an affair is exposed, which he’s still carrying on in secret.</p>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 6px;">Meanwhile, Michael Townley and Mariana Callejas have become important operatives whose assignments take them from Miami to Mexico City and across Europe, where they cultivate alliances with far-right organizations and organize assassination plots targeting opponents of the Chilean government. As Mariana manages these relationships and Michael produces biological, chemical and conventional weapons, their private ambitions become inseparable from the regime's political violence.</p>
            <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6;">As Orlando's campaign gains momentum, Michael Townley is closing in, and the political conflict that has shaped their lives will resonate far beyond them.</p>
          </article>

        <section id="author-profile-summary">
          <h2 style="font-size: 20px; font-weight: 600; color: #e5e7eb; margin-bottom: 12px;">Author Profile – David Serafino</h2>
          <p style="font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 12px;">David Serafino is an American writer, painter, travel photographer and translator who lives near Medellín, Colombia with his son and pups. His short stories have appeared in AGNI, The Common, The Los Angeles Review, and various other literary magazines and websites in the U.S., U.K., Canada and India, several of which have been nominated for prizes such as the O. Henry, Pushcart, Best of the Net, and the WSFA award. He has an MFA in Fiction from the University of Virginia, a BA in English from the College of William and Mary, has lived in a dozen countries, and has recently written a novel in Spanish. His travel photography is on Instagram at the link below.</p>
